name: Linux Static Build
on: [push, workflow_dispatch]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools cmake build-essential

      - name: Build Static Binary
        env:
          # On force le compilateur musl pour le C et le C++
          CC: musl-gcc
          CXX: musl-gcc
          # On indique à Rust de lier les bibliothèques C de façon statique
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: ygege-linux-static
          path: target/x86_64-unknown-linux-musl/release/ygege
